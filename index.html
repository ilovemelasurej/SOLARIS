<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Your Plant — SOLARIS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        html, body.config-page {
            min-height: 100vh;
            width: 100%;
            margin: 0;
            background:
                radial-gradient(circle at 16% 24%, rgba(73, 189, 232, 0.16), transparent 44%),
                radial-gradient(circle at 75% 75%, rgba(55, 201, 130, 0.14), transparent 50%),
                linear-gradient(180deg, #071b16 0%, #09221b 68%, #0d1d15 100%);
            color: #edf8f1;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* Ground mist line at very bottom */
        body.config-page::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            background: linear-gradient(180deg, rgba(7, 27, 22, 0), rgba(14, 34, 22, 0.72) 70%, rgba(9, 20, 14, 0.95) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .solaris-layout-stage {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(320px, 46vw) minmax(0, 1fr);
            align-items: center;
            padding: 28px 36px 0 0;
            box-sizing: border-box;
        }

        /* Borderless plant anchored all the way to the bottom edge */
        .plant-floor-anchor {
            position: relative;
            align-self: stretch;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            pointer-events: none;
        }

        .plant-botanical-svg {
            width: min(100%, 500px);
            height: min(94vh, 780px);
            max-height: 94vh;
            display: block;
            overflow: visible;
            filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
        }

        .botanical-species {
            display: none;
        }

        .botanical-species.is-active {
            display: inline;
        }

        /* Stem & branch extension animation (bottom -> top) */
        .grow-stem {
            stroke-dasharray: 900;
            stroke-dashoffset: 900;
            animation: stemExtend 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .grow-branch-1 {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: stemExtend 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
        }

        .grow-branch-2 {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: stemExtend 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.48s forwards;
        }

        .grow-branch-3 {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: stemExtend 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.72s forwards;
        }

        /* Leaves, flowers & fruits sprouting in sequence as branches grow */
        .sprout-leaf {
            opacity: 0;
            transform: scale(0.15);
            transform-box: fill-box;
            transform-origin: center;
            animation: leafSprout 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .d1 { animation-delay: 0.35s; }
        .d2 { animation-delay: 0.55s; }
        .d3 { animation-delay: 0.75s; }
        .d4 { animation-delay: 0.95s; }
        .d5 { animation-delay: 1.15s; }
        .d6 { animation-delay: 1.32s; }

        /* Subtle living breeze once fully grown */
        .breeze-group {
            transform-origin: 240px 710px;
            animation: gentlePlantBreeze 5.2s ease-in-out 1.5s infinite;
        }

        .config-card-column {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 40px;
        }

        .config-card-column .plant-config {
            width: 100%;
            max-width: 474px;
            margin: 0;
            box-sizing: border-box;
        }

        @keyframes stemExtend {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes leafSprout {
            0% {
                opacity: 0;
                transform: scale(0.15);
            }
            70% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gentlePlantBreeze {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(1.1deg);
            }
        }

        @media (max-width: 900px) {
            .solaris-layout-stage {
                grid-template-columns: 1fr;
                padding: 16px 14px 0;
            }
            .plant-floor-anchor {
                min-height: 360px;
                order: 2;
            }
            .plant-botanical-svg {
                height: 360px;
                max-height: 360px;
            }
            .config-card-column {
                order: 1;
                padding-bottom: 12px;
            }
        }
    </style>
</head>
<body class="config-page">

        </div>

        <!-- CONFIGURE YOUR PLANT CARD ON RIGHT -->
        <div class="config-card-column">
            <section class="plant-config" aria-labelledby="configure-heading">
                <h1 id="configure-heading">Configure Your Plant</h1>
                <p>Select the plant and environment you want the irrigation system to operate.</p>

                <label for="plantType">PLANT TYPE</label>
                <select id="plantType" name="plantType">
                    <option value="Kalamansi">Kalamansi</option>
                    <option value="Oregano">Oregano</option>
                </select>

                <label id="environment-label">ENVIRONMENT</label>
                <div class="environment-buttons" role="group" aria-labelledby="environment-label">
                    <button type="button" id="indoor" class="active" aria-pressed="true">Indoor</button>
                    <button type="button" id="outdoor" aria-pressed="false">Outdoor</button>
                </div>

                <a id="startMonitoring" href="monitoring.html">Start Monitoring</a>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const plantSelect = document.querySelector("#plantType");
            const kalamansiGroup = document.querySelector("#speciesKalamansi");
            const oreganoGroup = document.querySelector("#speciesOregano");
            const svgEl = document.querySelector("#plantBotanicalSvg");

            function replayGrowthAndSwitch() {
                if (!plantSelect || !kalamansiGroup || !oreganoGroup) return;
                const isOregano = plantSelect.value.toLowerCase() === "oregano";

                kalamansiGroup.classList.toggle("is-active", !isOregano);
                oreganoGroup.classList.toggle("is-active", isOregano);

                const activeGroup = isOregano ? oreganoGroup : kalamansiGroup;
                const animatedEls = activeGroup.querySelectorAll(".grow-stem, .grow-branch-1, .grow-branch-2, .grow-branch-3, .sprout-leaf");
                animatedEls.forEach((el) => {
                    el.style.animation = "none";
                    void el.offsetWidth;
                    el.style.animation = "";
                });

                if (svgEl) {
                    svgEl.style.opacity = "0.92";
                    requestAnimationFrame(() => {
                        svgEl.style.transition = "opacity 0.25s ease";
                        svgEl.style.opacity = "1";
                    });
                }
            }

            plantSelect?.addEventListener("change", replayGrowthAndSwitch);
            replayGrowthAndSwitch();
        });
    </script>
</body>
</html>

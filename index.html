<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure Your Plant — SOLARIS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        html, body.config-page {
            min-height: 100vh;
            width: 100%;
            margin: 0;
            background: #040b09;
            color: #edf8f1;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            --sky-tint: rgba(255, 232, 150, 0.18);
            --mood-filter: brightness(1.06) saturate(1.12);
        }

        body.config-page.mood-daylight {
            --sky-tint: rgba(255, 240, 185, 0.34);
            --mood-filter: brightness(1.08) saturate(1.14);
        }

        body.config-page.mood-sunset {
            --sky-tint: rgba(251, 146, 60, 0.34);
            --mood-filter: brightness(0.98) saturate(1.26) sepia(0.12);
        }

        body.config-page.mood-night {
            --sky-tint: rgba(30, 64, 120, 0.28);
            --mood-filter: brightness(0.78) saturate(1.06) hue-rotate(8deg);
        }

        body.config-page.mood-rain {
            --sky-tint: rgba(100, 116, 139, 0.26);
            --mood-filter: brightness(0.86) saturate(0.88) contrast(1.04);
        }

        /* Dynamic background scene (Indoor window vs Outdoor farm) */
        .env-scene-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            filter: var(--mood-filter);
            transition: filter 0.45s ease;
        }

        .scene-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.55s ease;
        }

        .scene-layer.is-active {
            opacity: 1;
        }

        .indoor-scene {
            background:
                radial-gradient(circle at 22% 24%, var(--sky-tint), transparent 52%),
                radial-gradient(circle at 75% 75%, rgba(55, 201, 130, 0.10), transparent 52%),
                linear-gradient(180deg, #071612 0%, #0a201a 68%, #040907 100%);
        }

        .outdoor-scene {
            background:
                radial-gradient(circle at 24% 18%, var(--sky-tint), transparent 48%),
                linear-gradient(180deg, #0b1f1a 0%, #102a21 56%, #132216 100%);
        }

        .scene-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Shared Sun transition logic across Daylight / Sunset / Rain / Night */
        .celestial-sun {
            transform: translateY(0px);
            opacity: 0.96;
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease;
        }

        .celestial-sun-core {
            fill: #fde68a;
            transition: fill 0.75s ease;
        }

        .celestial-sun-halo {
            fill: rgba(251, 191, 36, 0.42);
            transition: fill 0.75s ease;
        }

        body.mood-sunset .celestial-sun {
            transform: translateY(150px);
            opacity: 0.96;
        }

        body.mood-sunset .celestial-sun-core {
            fill: #fb923c;
        }

        body.mood-sunset .celestial-sun-halo {
            fill: rgba(249, 115, 22, 0.46);
        }

        body.mood-rain .celestial-sun {
            transform: translateY(12px);
            opacity: 0.55;
        }

        body.mood-night .celestial-sun {
            transform: translateY(110px);
            opacity: 0;
        }

        .celestial-moon {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.65s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.mood-night .celestial-moon {
            opacity: 1;
            transform: translateY(0px);
        }

        .grey-rain-clouds {
            opacity: 0;
            transform: translateY(-12px);
            transition: opacity 0.55s ease, transform 0.65s ease;
        }

        body.mood-rain .grey-rain-clouds {
            opacity: 1;
            transform: translateY(0px);
        }

        .fx-group {
            display: none;
        }

        .fx-group.is-active {
            display: inline;
        }

        .rain-streak {
            animation: rainFall 0.85s linear infinite;
        }

        /* Floating dust particles in light beam */
        .dust-mote {
            animation: dustDrift 7s ease-in-out infinite;
        }

        .dust-mote.d-slow {
            animation-duration: 9.5s;
            animation-delay: -2.4s;
        }

        .dust-mote.d-fast {
            animation-duration: 5.5s;
            animation-delay: -4.1s;
        }

        /* Right-corner 4-option scenery switcher */
        .scenery-switcher-corner {
            position: fixed;
            top: 18px;
            right: 22px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 999px;
            border: 1px solid rgba(237, 248, 241, 0.18);
            background: rgba(8, 24, 19, 0.78);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        .scenery-opt-btn {
            padding: 6px 11px;
            border-radius: 999px;
            background: transparent;
            color: #9ab9a8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .scenery-opt-btn:hover {
            color: #edf8f1;
            transform: none;
        }

        .scenery-opt-btn.active {
            background: linear-gradient(90deg, #37c982, #49bde8);
            color: #072219;
        }

        .solaris-layout-stage {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(330px, 47vw) minmax(0, 1fr);
            align-items: center;
            padding: 20px 36px 0 0;
            box-sizing: border-box;
        }

        /* Borderless plant anchored straight to bottom edge */
        .plant-floor-anchor {
            position: relative;
            align-self: stretch;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            pointer-events: none;
        }

        .plant-botanical-svg {
            width: min(100%, 500px);
            height: min(94vh, 780px);
            max-height: 94vh;
            display: block;
            overflow: visible;
            filter: var(--mood-filter) drop-shadow(0 16px 32px rgba(0, 0, 0, 0.65));
            transition: filter 0.45s ease;
        }

        .botanical-species {
            display: none;
        }

        .botanical-species.is-active {
            display: inline;
        }

        .indoor-pot-group {
            opacity: 1;
            transition: opacity 0.35s ease;
        }

        body.env-outdoor .indoor-pot-group {
            opacity: 0;
        }

        /* Stem rising & extending upward */
        .grow-stem {
            stroke-dasharray: 950;
            stroke-dashoffset: 950;
            animation: nightStemGrow 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .grow-branch-1 {
            stroke-dasharray: 520;
            stroke-dashoffset: 520;
            animation: nightStemGrow 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.28s forwards;
        }

        .grow-branch-2 {
            stroke-dasharray: 520;
            stroke-dashoffset: 520;
            animation: nightStemGrow 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.52s forwards;
        }

        .grow-branch-3 {
            stroke-dasharray: 520;
            stroke-dashoffset: 520;
            animation: nightStemGrow 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.76s forwards;
        }

        .sprout-leaf {
            opacity: 0;
            transform: scale(0.18) translateY(12px);
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: nightLeafBloom 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .d1 { animation-delay: 0.35s; }
        .d2 { animation-delay: 0.55s; }
        .d3 { animation-delay: 0.75s; }
        .d4 { animation-delay: 0.95s; }
        .d5 { animation-delay: 1.15s; }
        .d6 { animation-delay: 1.35s; }

        .breeze-group {
            transform-origin: 235px 675px;
            animation: nightGardenSway 4.8s ease-in-out 1.4s infinite;
        }

        .grass-blade {
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: grassSway 4.2s ease-in-out infinite;
        }

        .grass-blade.alt {
            animation-duration: 5.1s;
            animation-delay: -1.4s;
        }

        .firefly-dot {
            animation: fireflyFloat 4.5s ease-in-out infinite;
        }

        .firefly-dot.f2 {
            animation-duration: 5.8s;
            animation-delay: -1.8s;
        }

        .firefly-dot.f3 {
            animation-duration: 6.4s;
            animation-delay: -3.1s;
        }

        .config-card-column {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 40px;
        }

        .config-card-column .plant-config {
            width: 100%;
            max-width: 474px;
            margin: 0;
            box-sizing: border-box;
            background: linear-gradient(145deg, rgba(16, 48, 38, 0.84), rgba(11, 34, 27, 0.88));
            backdrop-filter: blur(10px);
        }

        @keyframes nightStemGrow {
            to { stroke-dashoffset: 0; }
        }

        @keyframes nightLeafBloom {
            0% {
                opacity: 0;
                transform: scale(0.18) translateY(12px);
            }
            70% {
                opacity: 1;
                transform: scale(1.05) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes nightGardenSway {
            0%, 100% { transform: rotate(-1.1deg); }
            50% { transform: rotate(1.4deg); }
        }

        @keyframes grassSway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2.5deg); }
        }

        @keyframes fireflyFloat {
            0%, 100% {
                opacity: 0.25;
                transform: translateY(0px) scale(0.85);
            }
            50% {
                opacity: 0.95;
                transform: translateY(-10px) scale(1.15);
            }
        }

        @keyframes rainFall {
            0% { transform: translate(-10px, -26px); opacity: 0.25; }
            50% { opacity: 0.75; }
            100% { transform: translate(-24px, 38px); opacity: 0.1; }
        }

        @keyframes dustDrift {
            0%, 100% {
                transform: translate(0px, 0px) scale(0.85);
                opacity: 0.25;
            }
            50% {
                transform: translate(18px, -14px) scale(1.2);
                opacity: 0.85;
            }
        }

        @media (max-width: 900px) {
            .scenery-switcher-corner {
                top: 12px;
                right: 12px;
                flex-wrap: wrap;
                max-width: calc(100% - 24px);
            }
            .solaris-layout-stage {
                grid-template-columns: 1fr;
                padding: 58px 14px 0;
            }
            .plant-floor-anchor {
                min-height: 360px;
                order: 2;
            }
            .plant-botanical-svg {
                height: 360px;
                max-height: 360px;
            }
            .config-card-column {
                order: 1;
                padding-bottom: 12px;
            }
        }
    </style>
</head>

    <main class="solaris-layout-stage">
        <div class="plant-floor-anchor" aria-label="Animated Plant Growth Preview">

                <defs>
                    <linearGradient id="kalamansiStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#3f6e58" />
                        <stop offset="55%" stop-color="#5da87a" />
                        <stop offset="100%" stop-color="#8be0a6" />
                    </linearGradient>

                    <linearGradient id="kalamansiLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6ce09b" />
                        <stop offset="55%" stop-color="#379e6c" />
                        <stop offset="100%" stop-color="#1b5c42" />
                    </linearGradient>

                    <radialGradient id="ripeKalamansiGrad" cx="34%" cy="28%" r="72%">
                        <stop offset="0%" stop-color="#ffe066" />
                        <stop offset="58%" stop-color="#f59e0b" />
                        <stop offset="100%" stop-color="#b45309" />
                    </radialGradient>

                    <radialGradient id="unripeKalamansiGrad" cx="35%" cy="30%" r="72%">
                        <stop offset="0%" stop-color="#a7f3a0" />
                        <stop offset="62%" stop-color="#4ade80" />
                        <stop offset="100%" stop-color="#15803d" />
                    </radialGradient>

                    <linearGradient id="oreganoStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#476e60" />
                        <stop offset="100%" stop-color="#87c2ad" />

        <div class="config-card-column">
            <section class="plant-config" aria-labelledby="configure-heading">
                <h1 id="configure-heading">Configure Your Plant</h1>
                <p>Select the plant and environment you want the irrigation system to operate.</p>

                <label for="plantType">PLANT TYPE</label>
                <select id="plantType" name="plantType">
                    <option value="Kalamansi">Kalamansi</option>
                    <option value="Oregano">Oregano</option>
                </select>

                <label id="environment-label">ENVIRONMENT</label>
                <div class="environment-buttons" role="group" aria-labelledby="environment-label">
                    <button type="button" id="indoor" class="active" aria-pressed="true">Indoor</button>
                    <button type="button" id="outdoor" aria-pressed="false">Outdoor</button>
                </div>

                <a id="startMonitoring" href="monitoring.html">Start Monitoring</a>
            </section>
        </div>

    <audio id="bgMusic" src="music.mp3" controls autoplay loop muted></audio>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const plantSelect = document.querySelector("#plantType");
            const kalamansiGroup = document.querySelector("#speciesKalamansi");
            const oreganoGroup = document.querySelector("#speciesOregano");
            const indoorScene = document.querySelector("#indoorScene");
            const outdoorScene = document.querySelector("#outdoorScene");
            const indoorBtn = document.querySelector("#indoor");
            const outdoorBtn = document.querySelector("#outdoor");
            const sceneryBtns = document.querySelectorAll(".scenery-opt-btn");
            const indoorFxRain = document.querySelector("#indoorFxRain");
            const outdoorFxRain = document.querySelector("#outdoorFxRain");
            const bgMusic = document.querySelector("#bgMusic");
            const startMonitoringLink = document.querySelector("#startMonitoring");

            function saveMusicState(forcePlaying = null) {
                if (!bgMusic) return;
                try {
                    localStorage.setItem("solarisMusicTime", String(bgMusic.currentTime || 0));
                    const isPlaying = forcePlaying !== null ? forcePlaying : !bgMusic.paused;
                    localStorage.setItem("solarisMusicPlaying", isPlaying ? "true" : "false");
                    localStorage.setItem("solarisMusicMuted", bgMusic.muted ? "true" : "false");
                } catch (_) {}
            }

            async function tryAutoplayMusic() {
                if (!bgMusic) return;
                const savedTime = parseFloat(localStorage.getItem("solarisMusicTime") || "0");
                const savedMuted = localStorage.getItem("solarisMusicMuted");

                const applySavedTime = () => {
                    if (Number.isFinite(savedTime) && savedTime > 0) {
                        const maxDur = Number.isFinite(bgMusic.duration) && bgMusic.duration > 0
                            ? bgMusic.duration - 0.1
                            : savedTime;
                        try {
                            bgMusic.currentTime = Math.max(0, Math.min(savedTime, maxDur));
                        } catch (_) {}
                    }
                };

                if (bgMusic.readyState >= 1) {
                    applySavedTime();
                } else {
                    bgMusic.addEventListener("loadedmetadata", applySavedTime, { once: true });
                }

                if (savedMuted === "false") {
                    bgMusic.muted = false;
                    try {
                        await bgMusic.play();
                        saveMusicState(true);
                        return;
                    } catch (_) {}
                }

                bgMusic.muted = true;
                try {
                    await bgMusic.play();
                    saveMusicState(true);
                } catch (_) {}
            }

            function unlockAudioOnGesture() {
                if (!bgMusic) return;
                bgMusic.muted = false;
                bgMusic.play().then(() => {
                    saveMusicState(true);
                }).catch(() => {});
                document.removeEventListener("pointerdown", unlockAudioOnGesture);
                document.removeEventListener("keydown", unlockAudioOnGesture);
            }

            if (bgMusic) {
                tryAutoplayMusic();
                document.addEventListener("pointerdown", unlockAudioOnGesture, { passive: true });
                document.addEventListener("keydown", unlockAudioOnGesture, { passive: true });

                window.setInterval(() => {
                    if (!bgMusic.paused) {
                        saveMusicState(true);
                    }
                }, 250);

                bgMusic.addEventListener("play", () => saveMusicState(true));
                bgMusic.addEventListener("pause", () => saveMusicState(false));
                bgMusic.addEventListener("volumechange", () => saveMusicState());
                window.addEventListener("pagehide", () => saveMusicState());
                window.addEventListener("beforeunload", () => saveMusicState());
                startMonitoringLink?.addEventListener("click", () => saveMusicState());
            }

            function replayGrowth() {
                if (!plantSelect || !kalamansiGroup || !oreganoGroup) return;
                const isOregano = plantSelect.value.toLowerCase() === "oregano";

                kalamansiGroup.classList.toggle("is-active", !isOregano);
                oreganoGroup.classList.toggle("is-active", isOregano);

                const activeGroup = isOregano ? oreganoGroup : kalamansiGroup;
                const animatedEls = activeGroup.querySelectorAll(".grow-stem, .grow-branch-1, .grow-branch-2, .grow-branch-3, .sprout-leaf");
                animatedEls.forEach((el) => {
                    el.style.animation = "none";
                    void el.offsetWidth;
                    el.style.animation = "";
                });
            }

            function syncEnvironmentScene() {
                const isOutdoor = outdoorBtn?.classList.contains("active");
                document.body.classList.toggle("env-outdoor", Boolean(isOutdoor));
                document.body.classList.toggle("env-indoor", !isOutdoor);
                indoorScene?.classList.toggle("is-active", !isOutdoor);
                outdoorScene?.classList.toggle("is-active", Boolean(isOutdoor));
            }

            function applySceneryMode(mode) {
                const chosen = ["daylight", "sunset", "night", "rain"].includes(mode) ? mode : "daylight";
                document.body.classList.remove("mood-daylight", "mood-sunset", "mood-night", "mood-rain");
                document.body.classList.add(`mood-${chosen}`);

                sceneryBtns.forEach((btn) => {
                    btn.classList.toggle("active", btn.getAttribute("data-scenery") === chosen);
                });

                indoorFxRain?.classList.toggle("is-active", chosen === "rain");
                outdoorFxRain?.classList.toggle("is-active", chosen === "rain");
                localStorage.setItem("configuredScenery", chosen);
            }

            sceneryBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    applySceneryMode(btn.getAttribute("data-scenery"));
                });
            });

            plantSelect?.addEventListener("change", replayGrowth);
            indoorBtn?.addEventListener("click", () => {
                window.setTimeout(syncEnvironmentScene, 10);
            });
            outdoorBtn?.addEventListener("click", () => {
                window.setTimeout(syncEnvironmentScene, 10);
            });

            const savedScenery = localStorage.getItem("configuredScenery") || "daylight";
            replayGrowth();
            syncEnvironmentScene();
            applySceneryMode(savedScenery);
        });
    </script>
